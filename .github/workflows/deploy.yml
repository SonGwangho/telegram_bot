name: Deploy Telegram Bot

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Pull latest code
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"
        run: |
          $ErrorActionPreference = 'Stop'
          cd C:\programs\telegram_bot
          git fetch origin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git reset --hard origin/main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install requirements
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"
        run: |
          $ErrorActionPreference = 'Stop'
          & "C:\programs\telegram_bot\.venv\Scripts\python.exe" -m pip install -r "C:\programs\telegram_bot\requirements.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restart Telegram Bot
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            Restart-Service TelegramBot
          } catch {
            $runnerIdentity = [Security.Principal.WindowsIdentity]::GetCurrent()
            $runnerPrincipal = New-Object Security.Principal.WindowsPrincipal($runnerIdentity)
            Write-Host ('Runner elevated: ' + $runnerPrincipal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator))
            $serviceError = $_.Exception
            while ($null -ne $serviceError) {
              if ($serviceError -is [ComponentModel.Win32Exception]) {
                Write-Host ('Service control Windows error code: ' + $serviceError.NativeErrorCode)
              }
              $serviceError = $serviceError.InnerException
            }
            throw
          }
          $telegramService = Get-Service TelegramBot
          $telegramService.WaitForStatus('Running', [TimeSpan]::FromSeconds(30))
          Write-Host 'TelegramBot service is running.'
